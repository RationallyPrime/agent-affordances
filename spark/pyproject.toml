[project]
name = "afford-spark"
version = "0.1.0"
description = "Semantic coreutils over GPT-5.3-Codex-Spark — a bounded coprocessor, not an agent"
readme = "SPEC.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "typer>=0.16",
]

[project.scripts]
afford = "afford_spark.cli:app"

[dependency-groups]
# ruff/ty are deliberately not dev deps: the Weave-wide version authority is
# weave-doctrine's mise.toml (bare binaries on PATH via mise shims).
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afford_spark"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
