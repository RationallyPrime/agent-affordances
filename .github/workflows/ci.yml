name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linear-reads:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linear-reads
    steps:
      - uses: actions/checkout@v4
      - uses: ./toolchain
        with:
          tools: uv ruff ty
      - run: uv sync
      - run: ruff format --check .
      - run: ruff check .
      - run: ty check
      - run: uv run pytest -q

  spark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark
    steps:
      - uses: actions/checkout@v4
      - uses: ./toolchain
        with:
          tools: uv ruff ty
      - run: uv sync
      - run: ruff format --check .
      - run: ruff check .
      - run: ty check
      - run: uv run pytest -q
