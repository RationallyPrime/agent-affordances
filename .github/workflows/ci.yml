name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linear-reads:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linear-reads
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync
      # PINS in lockstep with weave-doctrine's mise.toml (private, unreadable
      # from GitHub-hosted runners). Public repos run GitHub-hosted so fork
      # PRs never execute on Weave metal; the pins stay.
      - run: uvx ruff@0.16.1 format --check .
      - run: uvx ruff@0.16.1 check .
      - run: uvx ty@0.0.63 check
      - run: uv run pytest -q
