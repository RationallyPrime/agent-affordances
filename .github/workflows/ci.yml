name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linear-reads:
    runs-on: [self-hosted, cx53]
    defaults:
      run:
        working-directory: linear-reads
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync
      # TRANSITIONAL PINS — authority is weave-doctrine's mise.toml (private,
      # unreadable from GitHub-hosted runners); delete at the cx53
      # self-hosted-runner migration, where mise provides the bare binaries.
      - run: uvx ruff@0.16.1 format --check .
      - run: uvx ruff@0.16.1 check .
      - run: uvx ty@0.0.63 check
      - run: uv run pytest -q
