name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linear-reads:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linear-reads
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -q
