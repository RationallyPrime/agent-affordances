# Weave-standard prek config (drop-in .pre-commit-config.yaml).
#
# The toolchain hooks call BARE binaries: mise.toml in this repo is the one
# version authority for ruff/ty/uv on every seat and CI runner — there is no
# hook rev to drift and no per-repo pin. The machine contract is `just tools`
# plus the mise shims on PATH; a wrong-version binary is a machine-setup bug,
# not a hook-config bug. Repos with extra needs (e.g. sokrates' accessor/doc
# gates) extend this; they never fork the shared core.

# Without this, a plain `prek install` only wires the pre-commit stage and the
# commit-msg + pre-push hooks below silently never run.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: 'pyproject\.toml$|^uv\.lock$'
      - id: ty
        name: ty type check
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
