[project]
name = "linear-reads"
version = "0.1.0"
description = "Token-lean read-only Linear CLI for agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "typer>=0.16",
]

[project.scripts]
linear-reads = "linear_reads.cli:app"

[dependency-groups]
# ruff/ty are deliberately not dev deps: the Weave-wide version authority is
# weave-doctrine's mise.toml (bare binaries on PATH via mise shims).
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
