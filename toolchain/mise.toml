# The one CI tool-version pin for every repo that uses ./action.yml. A caller
# picks the versions by pinning this action to a commit; nothing else in a
# caller names a tool version for these tools. The action loads this file as
# mise's global config, so a caller's own mise.toml naming the same tool takes
# precedence over it.
[tools]
uv = "0.12.1"
just = "1.55.1"
ruff = "0.16.1"
ty = "0.0.63"
cue = "0.17.1"
bun = "1.3.14"
