name: toolchain
description: Install the named tools at the versions pinned in this action's mise.toml.

inputs:
  tools:
    description: Space-separated tools from mise.toml to install, e.g. "uv ruff ty".
    required: true

runs:
  using: composite
  steps:
    # Exported for the rest of the job, so the mise shims resolve the pinned
    # versions in later steps too. The cache key hashes only config files
    # inside the workspace, so the pin file's own hash goes in the prefix.
    - id: pin
      shell: bash
      run: |
        echo "MISE_GLOBAL_CONFIG_FILE=$GITHUB_ACTION_PATH/mise.toml" >> "$GITHUB_ENV"
        echo "prefix=toolchain-$(sha256sum "$GITHUB_ACTION_PATH/mise.toml" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        version: 2026.8.2
        install_args: ${{ inputs.tools }}
        cache_key_prefix: ${{ steps.pin.outputs.prefix }}
