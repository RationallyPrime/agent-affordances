name: toolchain
description: Put the named tools, at the versions pinned in this action's mise.toml, first on PATH.

inputs:
  tools:
    description: Space-separated tools from mise.toml to install, e.g. "uv ruff ty".
    required: true

runs:
  using: composite
  steps:
    # The cache key hashes only config files inside the workspace, so the pin
    # file's own hash goes in the prefix.
    - id: pin
      shell: bash
      run: echo "prefix=toolchain-$(sha256sum "$GITHUB_ACTION_PATH/mise.toml" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # mise runs in this action's directory, where no caller config is on the
    # lookup path. Without shims, its env export adds the pinned install
    # directories to PATH, so a caller's mise.toml cannot re-resolve them.
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        version: 2026.8.2
        working_directory: ${{ github.action_path }}
        install_args: ${{ inputs.tools }}
        add_shims_to_path: false
        cache_key_prefix: ${{ steps.pin.outputs.prefix }}
